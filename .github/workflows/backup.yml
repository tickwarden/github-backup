          path: ${{ runner.temp }}/plaintext-IronCrest-sudo/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: İçerik içermeyen tarama raporu
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scan-report-IronCrest-sudo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-IronCrest-sudo/
          if-no-files-found: ignore
