name: Kalıcı ve bölünmüş hesap yedekleme
on:
  workflow_dispatch:
    inputs:
      capture_id:
        description: 'Eski capture için run ID; yeni yedek için boş bırakın'
        type: string
        default: ''
      plaintext_zip:
        description: 'Şifresiz ZIP de üret'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: persistent-private-backup
  cancel-in-progress: false
jobs:
  tick_capture:
    runs-on: [self-hosted, linux, x64, private-backup]
    timeout-minutes: 245
    env:
      ACCOUNT: tickwarden
      GH_TOKEN: ${{ secrets.TICKWARDEN_BACKUP_TOKEN }}
      ARCHIVE_PASSWORD: ${{ secrets.TICKWARDEN_BACKUP_PASSPHRASE }}
      PLAINTEXT_ZIP: ${{ inputs.plaintext_zip }}
      CAPTURE_ID_INPUT: ${{ inputs.capture_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Kalıcı özel dizini seç
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="${CAPTURE_ID_INPUT:-${GITHUB_RUN_ID}}"
          [[ "$key" =~ ^[0-9]+$ ]] || exit 1
          repo="${GITHUB_REPOSITORY//\//_}"
          base="$HOME/.private-github-backups/$repo/$key/$ACCOUNT"
          mkdir -p "$base"
          chmod 700 "$HOME/.private-github-backups" "$base"
          echo "BACKUP_STATE=$base" >> "$GITHUB_ENV"
          echo "CAPTURE_ID=$key" >> "$GITHUB_ENV"
          echo "Capture ID: $key; account: $ACCOUNT"
      - name: Ön kontroller
        shell: bash
        run: |
          set -euo pipefail
          command -v 7z; command -v gh; command -v github-backup
          python3 -c 'import py7zr'
          test -n "$GH_TOKEN"
          test "${#ARCHIVE_PASSWORD}" -ge 20
          if [ -f "$BACKUP_STATE/CAPTURE_OK" ]; then
            echo 'Existing capture found; current token identity lookup not required to reuse.'
          else
            actual="$(gh api user --jq .login)"
            test "${actual,,}" = "${ACCOUNT,,}"
            test -z "$CAPTURE_ID_INPUT" || { echo 'Requested prior capture is missing. Refusing unexpected recapture.'; exit 1; }
          fi
      - name: Yeni yedek al veya mevcut capture kullan
        run: RUNNER_TEMP="$BACKUP_STATE" bash scripts/capture-persistent.sh
  tick_verify:
    needs: tick_capture
    runs-on: [self-hosted, linux, x64, private-backup]
    timeout-minutes: 90
    env:
      ACCOUNT: tickwarden
      GH_TOKEN: ${{ secrets.TICKWARDEN_BACKUP_TOKEN }}
      ARCHIVE_PASSWORD: ${{ secrets.TICKWARDEN_BACKUP_PASSPHRASE }}
      PLAINTEXT_ZIP: ${{ inputs.plaintext_zip }}
      CAPTURE_ID_INPUT: ${{ inputs.capture_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Kalıcı özel dizini seç
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="${CAPTURE_ID_INPUT:-${GITHUB_RUN_ID}}"
          [[ "$key" =~ ^[0-9]+$ ]] || exit 1
          repo="${GITHUB_REPOSITORY//\//_}"
          base="$HOME/.private-github-backups/$repo/$key/$ACCOUNT"
          mkdir -p "$base"
          chmod 700 "$HOME/.private-github-backups" "$base"
          echo "BACKUP_STATE=$base" >> "$GITHUB_ENV"
          echo "CAPTURE_ID=$key" >> "$GITHUB_ENV"
          echo "Capture ID: $key; account: $ACCOUNT"
      - name: Aynı yedeği denetle (yeniden toplama yok)
        run: |
          test -f "$BACKUP_STATE/CAPTURE_OK"
          RUNNER_TEMP="$BACKUP_STATE" python3 scripts/verify.py
  tick_publish:
    needs: tick_verify
    runs-on: [self-hosted, linux, x64, private-backup]
    timeout-minutes: 90
    env:
      ACCOUNT: tickwarden
      GH_TOKEN: ${{ secrets.TICKWARDEN_BACKUP_TOKEN }}
      ARCHIVE_PASSWORD: ${{ secrets.TICKWARDEN_BACKUP_PASSPHRASE }}
      PLAINTEXT_ZIP: ${{ inputs.plaintext_zip }}
      CAPTURE_ID_INPUT: ${{ inputs.capture_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Kalıcı özel dizini seç
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="${CAPTURE_ID_INPUT:-${GITHUB_RUN_ID}}"
          [[ "$key" =~ ^[0-9]+$ ]] || exit 1
          repo="${GITHUB_REPOSITORY//\//_}"
          base="$HOME/.private-github-backups/$repo/$key/$ACCOUNT"
          mkdir -p "$base"
          chmod 700 "$HOME/.private-github-backups" "$base"
          echo "BACKUP_STATE=$base" >> "$GITHUB_ENV"
          echo "CAPTURE_ID=$key" >> "$GITHUB_ENV"
          echo "Capture ID: $key; account: $ACCOUNT"
      - name: Kontrolü geçen şifreli 7z
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-${{ env.ACCOUNT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BACKUP_STATE }}/approved-${{ env.ACCOUNT }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: İstenmişse şifresiz ZIP
        if: ${{ inputs.plaintext_zip }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNENCRYPTED-${{ env.ACCOUNT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BACKUP_STATE }}/plaintext-${{ env.ACCOUNT }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  iron_capture:
    runs-on: [self-hosted, linux, x64, private-backup]
    timeout-minutes: 245
