name: GitHub hesap yedekleri
on:
  workflow_dispatch:
    inputs:
      plaintext_zip:
        description: 'Şifresiz ZIP de üret ve artifact olarak yükle (özel kod içerir)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: private-account-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        account: [tickwarden, IronCrest-sudo]
    env:
      GH_TOKEN: ${{ matrix.account == 'tickwarden' && secrets.TICKWARDEN_BACKUP_TOKEN || secrets.IRONCREST_BACKUP_TOKEN }}
      ARCHIVE_PASSWORD: ${{ matrix.account == 'tickwarden' && secrets.TICKWARDEN_BACKUP_PASSPHRASE || secrets.IRONCREST_BACKUP_PASSPHRASE }}
      ACCOUNT: ${{ matrix.account }}
      PLAINTEXT_ZIP: ${{ inputs.plaintext_zip }}
    steps:
      - name: Workflow dosyalarını al
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bağımlılıklar
        env:
          GH_TOKEN: ''
          ARCHIVE_PASSWORD: ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git git-lfs p7zip-full python3-venv jq curl rsync
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install 'github-backup==0.67.0' 'py7zr==1.0.0'
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Yetki ve hesap kontrolü
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Hesap token secret eksik'; exit 1; }
          test "${#ARCHIVE_PASSWORD}" -ge 20 || { echo 'En az 20 karakterlik parola secret gerekli'; exit 1; }
          actual="$(gh api user --jq .login)"
          test "${actual,,}" = "${ACCOUNT,,}" || { echo 'Token yanlış hesaba ait'; exit 1; }
      - name: Yedekle (en fazla 4 saat)
        timeout-minutes: 245
        run: python3 -u scripts/run-with-progress.py
      - name: Şifre çözme ve temel sızıntı kontrolü
        timeout-minutes: 60
        run: |
          "$RUNNER_TEMP/tools/bin/python" scripts/verify.py
      - name: Yalnızca kontrolü geçen şifreli çıktıyı sakla
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-backup-${{ matrix.account }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-${{ matrix.account }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: İstenmişse şifresiz ZIP sakla
        if: ${{ success() && inputs.plaintext_zip }}
        uses: actions/upload-artifact@v7
        with:
          name: UNENCRYPTED-backup-${{ matrix.account }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plaintext-${{ matrix.account }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Yerel geçici çıktıları temizle
        if: always()
        env:
          GH_TOKEN: ''
          ARCHIVE_PASSWORD: ''
        run: |
          rm -rf -- "$RUNNER_TEMP/backup-$ACCOUNT" "$RUNNER_TEMP/out-$ACCOUNT" "$RUNNER_TEMP/approved-$ACCOUNT" "$RUNNER_TEMP/plaintext-$ACCOUNT"
          rm -f -- "$RUNNER_TEMP/raw-$ACCOUNT.log"
