name: GitHub hesap yedekleri
on:
  workflow_dispatch:
    inputs:
      plaintext_zip:
        description: 'Şifresiz ZIP de üret (özel kod içerir)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hosted-private-backup
  cancel-in-progress: false
jobs:
  tick_backup_scan:
    name: tickwarden — yedekle ve güvenlik kontrolü
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ACCOUNT: tickwarden
      GH_TOKEN: ${{ secrets.TICKWARDEN_BACKUP_TOKEN }}
      ARCHIVE_PASSWORD: ${{ secrets.TICKWARDEN_BACKUP_PASSPHRASE }}
      PLAINTEXT_ZIP: ${{ inputs.plaintext_zip && github.event.repository.private }}
      PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
    steps:
      - name: Yayın biçimini bildir — görünürlük zorunluluğu yok
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != true ]; then
            echo '::warning::Public repository: encrypted 7z enabled; unencrypted ZIP skipped. No visibility change required.'
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bağımlılıklar
        env:
          GH_TOKEN: ''
          ARCHIVE_PASSWORD: ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full git-lfs jq curl rsync python3-venv
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install github-backup==0.67.0 py7zr==1.0.0
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Hesap kontrolü
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "${#ARCHIVE_PASSWORD}" -ge 20
          actual="$(gh api user --jq .login)"
          test "${actual,,}" = "${ACCOUNT,,}"
      - name: Yedekle — 30 saniyede bir güvenli ilerleme logu
        id: capture
        continue-on-error: true
        timeout-minutes: 245
        run: |
          python3 -u - <<'PYTHON'
          import os, json, subprocess, time, re, signal
          from pathlib import Path
          os.umask(0o077)
          a=os.environ['ACCOUNT']; root=Path(os.environ['RUNNER_TEMP'])
          work=root/('backup-'+a); out=root/('out-'+a); log=root/('raw-'+a+'.log')
          work.mkdir(exist_ok=True); out.mkdir(exist_ok=True)
          cmd=['timeout','--signal=TERM','--kill-after=30s','4h','bash','scripts/backup-org.sh','--org',a,'--kind','user','--backup-dir',str(work),'--out-dir',str(out),'--encrypt','7z','--keep','999999','--no-source']
          start=time.monotonic(); offset=0; resource='starting'; last_change=start; old=None
          with log.open('wb') as output:
              child=subprocess.Popen(cmd,stdout=output,stderr=subprocess.STDOUT,stdin=subprocess.DEVNULL,start_new_session=True)
              try:
                  while True:
                      counts=0; size=0
                      for directory in (work,out):
                          for base,dirs,files in os.walk(directory,followlinks=False):
                              for name in files:
                                  path=Path(base)/name
                                  try:
                                      if not path.is_symlink(): counts+=1; size+=path.stat().st_size
                                  except OSError: pass
                      with log.open('rb') as inp:
                          inp.seek(offset); text=inp.read().decode(errors='replace'); offset=inp.tell()
                      # Only known labels/numbers are emitted; raw text/URLs never leave the runner.
                      for line in text.splitlines():
                          low=line.lower()
                          for label in ('cloning','issues','pull requests','discussions','milestones','security advisories','labels','releases','gists','encrypt','archive'):
                              if label in low: resource=label
                          statuses=re.findall(r'(?:HTTP[ /:]+|API Error: *)([1-5][0-9]{2})',line,re.I)
                          if statuses: print('HTTP_STATUS '+','.join(statuses)+' resource='+resource,flush=True)
                          if 'retry' in low or 'rate limit' in low: print('NETWORK_EVENT retry_or_rate_limit resource='+resource,flush=True)
                          if 'error' in low or 'failed' in low: print('COLLECTION_EVENT error resource='+resource+' (raw details kept private)',flush=True)
                      state=(counts,size,offset)
                      if state!=old: old=state; last_change=time.monotonic()
                      age=max(0,int(time.time()-log.stat().st_mtime))
                      print(f'[{a}] stage={resource} elapsed={int(time.monotonic()-start)}s files={counts} MiB={size/1048576:.2f} log_age={age}s unchanged={int(time.monotonic()-last_change)}s',flush=True)
                      try: rc=child.wait(timeout=30); break
                      except subprocess.TimeoutExpired: pass
              finally:
                  if child.poll() is None:
                      os.killpg(child.pid,signal.SIGTERM)
                      try: child.wait(timeout=5)
                      except subprocess.TimeoutExpired: os.killpg(child.pid,signal.SIGKILL); child.wait()
          (root/('COLLECTION-'+a+'.json')).write_text(json.dumps({'exit_code':rc,'strict_mode':False,'complete_collection_verified':False}))
          print('COLLECTION_EXIT '+str(rc)+' candidates='+str(len(list(out.glob('*.7z')))),flush=True)
          if rc: print('::warning::Collection returned nonzero; verification decides whether any safe partial output can be delivered.',flush=True)
          PYTHON
      - name: Doğrula — bulgulu depoları bütün olarak ayır
        timeout-minutes: 90
        run: '"$RUNNER_TEMP/tools/bin/python" -u scripts/verify.py'
      - name: Güvenli checkpoint — yalnız kontrolden geçen şifreli veri
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-checkpoint-tickwarden-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-tickwarden/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: İstenmişse güvenli ZIP checkpoint
        if: ${{ inputs.plaintext_zip && github.event.repository.private }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNENCRYPTED-checkpoint-tickwarden-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plaintext-tickwarden/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: İçerik içermeyen tarama raporu
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scan-report-tickwarden-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-tickwarden/
          if-no-files-found: ignore
          retention-days: 7
      - name: Geçici özel dosyaları temizle
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/backup-$ACCOUNT" "$RUNNER_TEMP/out-$ACCOUNT" "$RUNNER_TEMP/approved-$ACCOUNT" "$RUNNER_TEMP/plaintext-$ACCOUNT"
          rm -f -- "$RUNNER_TEMP/raw-$ACCOUNT.log"
  tick_publish:
    name: tickwarden — ayrı job ile teslim kontrolü
    needs: tick_backup_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Kontrolden geçmiş checkpoint'i al
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: checked-checkpoint-tickwarden-${{ github.run_id }}-*
          path: delivery
          merge-multiple: true
      - name: SHA-256 ve kapsamı logda doğrula
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          sha256sum -c -- *.sha256
          python3 -c 'import json; d=json.load(open("COVERAGE.json")); print("Coverage:", d["status"], "Withheld repositories:", len(d.get("withheld_repository_units", [])), "Full backup verified:", d["complete_backup_verified"])'
