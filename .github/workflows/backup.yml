      - name: Güvenli checkpoint — yalnız kontrolden geçen şifreli veri
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-checkpoint-IronCrest-sudo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-IronCrest-sudo/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: İstenmişse güvenli ZIP checkpoint
        if: ${{ inputs.plaintext_zip && github.event.repository.private }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
